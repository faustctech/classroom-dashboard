<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Classroom Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease;
      overflow-x: hidden;
    }

    /* Top Navigation Toolbar */
    header {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 10000;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    
    .btn, select {
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }
    .btn:hover, select:hover { background: var(--accent-color); border-color: var(--accent-color); }
    select optgroup { background: #0f172a; color: #94a3b8; font-weight: bold; }
    select option { background: #1e293b; color: #fff; }
    .btn-action { background: var(--accent-color); }
    .btn-action:hover { background: var(--accent-hover); }
    .btn-danger { background: #7f1d1d; }
    .btn-danger:hover { background: #991b1b; }

    .control-group {
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    /* Free-Floating Board Canvas */
    .dashboard {
      position: relative;
      flex: 1;
      width: 100vw;
      min-height: calc(100vh - 75px);
      padding: 10px;
    }

    .widget {
      position: absolute;
      width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      touch-action: none;
      user-select: none;
      transition: box-shadow 0.2s ease;
    }

    .widget:active {
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.3);
    }

    input, textarea, select, button, iframe, .group-output, .links-grid, .media-playlist { 
      touch-action: auto; 
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      cursor: move;
    }
    .widget-title { font-size: 1.05rem; font-weight: 600; color: #cbd5e1; display: flex; align-items: center; gap: 8px; }
    .drag-handle { cursor: move; opacity: 0.6; font-size: 1.1rem; }

    /* Specific Widget Styling */
    .display-large { font-size: 2.8rem; font-weight: 700; text-align: center; font-family: monospace; letter-spacing: 2px; }
    .sub-display { text-align: center; color: #94a3b8; font-size: 0.95rem; font-weight: 500; }
    .inputs-row { display: flex; gap: 8px; justify-content: center; align-items: center; }
    
    input[type="text"], input[type="number"], textarea, select {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      outline: none;
    }
    textarea { width: 100%; height: 90px; resize: vertical; cursor: text; }

    .result-box {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 6px;
    }

    /* Dice Specific */
    .dice-display { font-size: 3.5rem; letter-spacing: 12px; line-height: 1; }

    /* Group Output Box */
    .group-output {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Noise Meter */
    .meter-container {
      width: 100%;
      height: 24px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.1s ease, background-color 0.2s ease;
    }

    /* Status Icons */
    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .status-btn {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid transparent;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.35;
      transition: all 0.2s;
    }
    .status-btn.active { opacity: 1; transform: scale(1.04); }
    .status-red { background: #7f1d1d; color: #fca5a5; }
    .status-yellow { background: #78350f; color: #fde68a; }
    .status-green { background: #064e3b; color: #6ee7b7; }

    /* Quick Links Widget */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .link-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .link-card:hover { background: var(--accent-color); border-color: var(--accent-color); }
    .link-del-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 4px;
    }
    .link-del-btn:hover { color: #fca5a5; }

    /* Media & Presentation Player Widget */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .media-playlist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
    }
    .media-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.8);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
    }
    .media-item:hover { background: rgba(51, 65, 85, 0.9); }
    .media-item.active { border-color: var(--accent-color); background: rgba(59, 130, 246, 0.25); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h2>Classroom Board</h2>
    
    <!-- Saved Presets / Board Setup Switcher -->
    <div class="control-group">
      <span style="font-size: 0.85rem; color: #cbd5e1; font-weight: 600;">Board Setup:</span>
      <select id="preset-selector" onchange="switchPreset(this.value)"></select>
      <button class="btn btn-action" onclick="saveNewPresetPrompt()" title="Save Current Board Layout">💾 Save</button>
      <button class="btn btn-danger" onclick="deleteCurrentPreset()" title="Delete Current Board Setup">🗑️</button>
      <button class="btn" onclick="exportSetupToFile()" title="Export Setup to File">📥 Export</button>
      <button class="btn" onclick="document.getElementById('import-file-input').click()" title="Import Setup from File">📤 Import</button>
      <input type="file" id="import-file-input" accept=".json" style="display:none" onchange="importSetupFromFile(event)">
    </div>

    <!-- Class Period Management Controls -->
    <div class="control-group">
      <span style="font-size: 0.85rem; color: #cbd5e1; font-weight: 600;">Class:</span>
      <select id="class-selector" onchange="switchClassPeriod(this.value)"></select>
      <button class="btn" onclick="addNewClassPeriod()">➕</button>
      <button class="btn btn-danger" onclick="deleteCurrentClassPeriod()">🗑️</button>
    </div>

    <!-- Theme / Background Selector -->
    <div class="control-group">
      <span style="font-size: 0.85rem; color: #cbd5e1; font-weight: 600;">Theme:</span>
      <select id="bg-selector" onchange="handleBgChange(this.value)">
        <optgroup label="Seasonal Themes">
          <option value="summer" selected>☀️ Sunny Beach</option>
          <option value="spring">🌸 Spring Blossom</option>
          <option value="autumn">🍁 Autumn / Fall Leaves</option>
          <option value="winter">❄️ Winter Snow</option>
          <option value="halloween">🎃 Autumn Fest / Halloween</option>
        </optgroup>
        <optgroup label="Default">
          <option value="default">🎨 Dark Gradient</option>
        </optgroup>
        <optgroup label="Paper & Canvas">
          <option value="lined">📝 Lined Notebook Paper</option>
          <option value="grid">📐 Grid / Graph Paper</option>
          <option value="dotgrid">⚪ Dot Grid Paper</option>
          <option value="anchorchart">📌 Empty Wooden Desk Wall</option>
        </optgroup>
        <optgroup label="Daily Agenda Templates">
          <option value="agenda_desk">🗓️ Flat Lay Planner Desk</option>
          <option value="agenda_cork">📌 Corkboard Notice Board</option>
          <option value="agenda_board">📋 Clean Slate Wall</option>
        </optgroup>
        <optgroup label="Solid Colors">
          <option value="solid_green">🟩 Chalkboard Green</option>
          <option value="solid_slate">⬛ Dark Slate</option>
          <option value="solid_blue">🟦 Classroom Blue</option>
          <option value="solid_pastel_blue">🩵 Soft Pastel Blue</option>
          <option value="solid_cream">🟨 Soft Warm Cream</option>
          <option value="solid_purple">🟪 Deep Purple</option>
        </optgroup>
        <optgroup label="Gradients">
          <option value="grad_sunset">🌅 Sunset Horizon</option>
          <option value="grad_ocean">🌊 Ocean Calm</option>
          <option value="grad_northern">🌌 Northern Lights</option>
          <option value="grad_midnight">🌃 Midnight Glow</option>
          <option value="grad_peach">🍑 Soft Warm Peach</option>
          <option value="grad_forest">🌲 Emerald Forest</option>
        </optgroup>
        <optgroup label="Classroom Atmosphere">
          <option value="chalkboard">✏️ Empty Chalkboard Texture</option>
          <option value="watercolor">🎨 Bright Watercolor</option>
          <option value="space">🚀 Outer Space</option>
          <option value="jungle">🦁 Deep Forest Foliage</option>
          <option value="gaming">🎮 Retro Arcade</option>
          <option value="neon">🌆 Vaporwave / Neon</option>
          <option value="library">📚 Empty Library Bookshelves</option>
        </optgroup>
        <optgroup label="Custom">
          <option value="custom">📁 Upload Custom Image...</option>
        </optgroup>
      </select>
      <input type="file" id="bg-upload" accept="image/*" style="display:none" onchange="uploadCustomBg(event)">
    </div>

    <!-- Widget Toggle Toolbar -->
    <div class="toolbar">
      <button class="btn" onclick="toggleWidget('clock-widget')">⏰ Clock</button>
      <button class="btn" onclick="toggleWidget('timer-widget')">⏱️ Timer</button>
      <button class="btn" onclick="toggleWidget('media-widget')">📊 Slides & Media</button>
      <button class="btn" onclick="toggleWidget('links-widget')">🔗 Shortcuts</button>
      <button class="btn" onclick="toggleWidget('picker-widget')">🎲 Picker</button>
      <button class="btn" onclick="toggleWidget('dice-widget')">🎲 Dice</button>
      <button class="btn" onclick="toggleWidget('group-widget')">👥 Groups</button>
      <button class="btn" onclick="toggleWidget('noise-widget')">🎙️ Noise</button>
      <button class="btn" onclick="toggleWidget('status-widget')">🚦 Status</button>
      <button class="btn" onclick="toggleWidget('notes-widget')">📝 Notes</button>
      <button class="btn btn-action" onclick="resetWidgetPositions()">🔄 Reset Positions</button>
    </div>
  </header>

  <main class="dashboard" id="dashboard">

    <!-- Digital Clock Widget -->
    <div class="widget" id="clock-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Digital Clock</span>
        <button class="btn" onclick="toggleWidget('clock-widget')">✕</button>
      </div>
      <div class="display-large" id="clock-display">00:00:00 AM</div>
      <div class="sub-display" id="clock-date">Loading date...</div>
      <div class="inputs-row">
        <button class="btn" onclick="toggleClockFormat()">Toggle 12/24h</button>
      </div>
    </div>

    <!-- Timer Widget -->
    <div class="widget" id="timer-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Timer</span>
        <button class="btn" onclick="toggleWidget('timer-widget')">✕</button>
      </div>
      <div class="display-large" id="timer-display">05:00</div>
      <div class="inputs-row">
        <input type="number" id="timer-min" placeholder="Min" min="0" value="5" style="width: 70px;">
        <button class="btn btn-action" onclick="startTimer()">Start</button>
        <button class="btn" onclick="pauseTimer()">Pause</button>
        <button class="btn" onclick="resetTimer()">Reset</button>
      </div>
      <div class="inputs-row">
        <label for="timer-sound" style="font-size: 0.85rem; color: #cbd5e1;">Sound Alert:</label>
        <select id="timer-sound" style="font-size: 0.85rem;">
          <option value="chime">🔔 Gentle Chime</option>
          <option value="beep">📟 Digital Beep</option>
          <option value="bell">🏫 School Bell</option>
          <option value="fanfare">🎉 Victory Fanfare</option>
        </select>
        <button class="btn" onclick="testTimerSound()" style="padding: 4px 8px; font-size: 0.8rem;">🔊 Test</button>
      </div>
    </div>

    <!-- Media & Presentation Player Widget (Google Slides, Canva, YouTube) -->
    <div class="widget" id="media-widget" style="width: 420px;">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Slides & Media Player</span>
        <button class="btn" onclick="toggleWidget('media-widget')">✕</button>
      </div>
      <div class="video-container">
        <iframe id="media-player" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div id="media-list" class="media-playlist"></div>
      <div class="inputs-row" style="flex-wrap: wrap; gap: 6px;">
        <input type="text" id="media-title" placeholder="Title (e.g. History Slides)" style="flex: 1; min-width: 110px; font-size: 0.85rem;">
        <input type="text" id="media-url" placeholder="Google Slides, Canva, or YouTube URL..." style="flex: 1.5; min-width: 140px; font-size: 0.85rem;">
        <button class="btn btn-action" onclick="addMediaVideo()" style="font-size: 0.85rem;">➕ Add</button>
      </div>
    </div>

    <!-- Quick Links Widget -->
    <div class="widget" id="links-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Quick Shortcuts</span>
        <button class="btn" onclick="toggleWidget('links-widget')">✕</button>
      </div>
      <div id="links-container" class="links-grid"></div>
      <div class="inputs-row" style="flex-wrap: wrap; gap: 6px;">
        <input type="text" id="link-title" placeholder="Site Name" style="flex: 1; min-width: 90px; font-size: 0.85rem;">
        <input type="text" id="link-url" placeholder="https://..." style="flex: 1.5; min-width: 120px; font-size: 0.85rem;">
        <button class="btn btn-action" onclick="addQuickLink()" style="font-size: 0.85rem;">➕ Add</button>
      </div>
    </div>

    <!-- Dice Roller Widget -->
    <div class="widget" id="dice-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Dice Roller</span>
        <button class="btn" onclick="toggleWidget('dice-widget')">✕</button>
      </div>
      <div class="result-box dice-display" id="dice-result">⚀</div>
      <div class="sub-display" id="dice-sum">Total: 1</div>
      <div class="inputs-row">
        <label for="dice-count" style="font-size: 0.85rem;">Dice:</label>
        <select id="dice-count" style="width: 70px;">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
        <button class="btn btn-action" onclick="rollDice()">Roll</button>
      </div>
    </div>

    <!-- Group Generator Widget -->
    <div class="widget" id="group-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Group Maker</span>
        <button class="btn" onclick="toggleWidget('group-widget')">✕</button>
      </div>
      <textarea id="group-name-list" placeholder="Enter student names (one per line)..."></textarea>
      <div class="inputs-row">
        <input type="number" id="group-size" value="3" min="2" style="width: 80px;" placeholder="Size">
        <button class="btn btn-action" onclick="generateGroups()">Make Groups</button>
      </div>
      <div class="group-output" id="group-results"></div>
    </div>

    <!-- Random Name Picker Widget -->
    <div class="widget" id="picker-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Random Picker</span>
        <button class="btn" onclick="toggleWidget('picker-widget')">✕</button>
      </div>
      <textarea id="name-list" placeholder="Enter list (one name per line)..."></textarea>
      <button class="btn btn-action" onclick="pickRandomName()">Pick Random</button>
      <div class="result-box" id="picker-result">?</div>
    </div>

    <!-- Noise Meter Widget -->
    <div class="widget" id="noise-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Noise Monitor</span>
        <button class="btn" onclick="toggleWidget('noise-widget')">✕</button>
      </div>
      <div class="meter-container">
        <div class="meter-fill" id="meter-fill"></div>
      </div>
      <button class="btn btn-action" id="mic-btn" onclick="initNoiseMeter()">Enable Mic</button>
    </div>

    <!-- Work Status Widget -->
    <div class="widget" id="status-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Work Mode</span>
        <button class="btn" onclick="toggleWidget('status-widget')">✕</button>
      </div>
      <div class="status-grid">
        <div class="status-btn status-red" id="st-red" onclick="setStatus('red')">Silence</div>
        <div class="status-btn status-yellow" id="st-yellow" onclick="setStatus('yellow')">Whisper</div>
        <div class="status-btn status-green" id="st-green" onclick="setStatus('green')">Group Work</div>
      </div>
    </div>

    <!-- Notes Widget -->
    <div class="widget" id="notes-widget">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Notes & Agenda</span>
        <button class="btn" onclick="toggleWidget('notes-widget')">✕</button>
      </div>
      <textarea id="notes-content" style="height: 120px;" placeholder="Write daily announcements or instructions..." oninput="saveCurrentStateToPreset()"></textarea>
    </div>

  </main>

  <script>
    // --- Toggle Visibility ---
    function toggleWidget(id) {
      const widget = document.getElementById(id);
      widget.style.display = (widget.style.display === 'none') ? 'flex' : 'none';
      saveCurrentStateToPreset();
    }

    // --- Absolute Free-Floating Drag & Drop System ---
    const dashboard = document.getElementById('dashboard');
    const widgets = document.querySelectorAll('.widget');
    let highestZIndex = 10;

    let savedPositions = JSON.parse(localStorage.getItem('classroom_widget_positions')) || {};

    function positionWidgets() {
      const margin = 16;
      let col = 0, row = 0;
      const colWidth = 360;
      const rowHeight = 310;
      const maxCols = Math.floor((window.innerWidth - margin * 2) / colWidth) || 1;

      widgets.forEach((widget) => {
        const id = widget.id;
        if (savedPositions[id]) {
          widget.style.left = savedPositions[id].left;
          widget.style.top = savedPositions[id].top;
          widget.style.zIndex = savedPositions[id].zIndex || 10;
          if (parseInt(savedPositions[id].zIndex) > highestZIndex) highestZIndex = parseInt(savedPositions[id].zIndex);
        } else {
          const left = margin + (col * colWidth);
          const top = margin + (row * rowHeight);
          widget.style.left = `${left}px`;
          widget.style.top = `${top}px`;
          widget.style.zIndex = 10;

          col++;
          if (col >= maxCols) {
            col = 0;
            row++;
          }
        }
      });
    }

    function resetWidgetPositions() {
      localStorage.removeItem('classroom_widget_positions');
      savedPositions = {};
      positionWidgets();
      saveCurrentStateToPreset();
    }

    widgets.forEach(widget => {
      widget.addEventListener('pointerdown', (e) => {
        if (e.target.closest('input, textarea, select, button, a, iframe, .link-card, .status-btn, .media-item')) {
          return;
        }

        highestZIndex++;
        widget.style.zIndex = highestZIndex;

        const rect = widget.getBoundingClientRect();
        const dashRect = dashboard.getBoundingClientRect();

        const offsetX = e.clientX - rect.left;
        const offsetY = e.clientY - rect.top;

        widget.setPointerCapture(e.pointerId);

        function onPointerMove(ev) {
          let newLeft = ev.clientX - dashRect.left - offsetX;
          let newTop = ev.clientY - dashRect.top - offsetY;

          newLeft = Math.max(0, Math.min(newLeft, dashRect.width - rect.width));
          newTop = Math.max(0, newTop);

          widget.style.left = `${newLeft}px`;
          widget.style.top = `${newTop}px`;
        }

        function onPointerUp(ev) {
          try { widget.releasePointerCapture(ev.pointerId); } catch(err) {}
          widget.removeEventListener('pointermove', onPointerMove);
          widget.removeEventListener('pointerup', onPointerUp);

          savedPositions[widget.id] = {
            left: widget.style.left,
            top: widget.style.top,
            zIndex: widget.style.zIndex
          };
          localStorage.setItem('classroom_widget_positions', JSON.stringify(savedPositions));
          saveCurrentStateToPreset();
        }

        widget.addEventListener('pointermove', onPointerMove);
        widget.addEventListener('pointerup', onPointerUp);
      });
    });

    // --- Board Presets System ---
    let presetsData = JSON.parse(localStorage.getItem('classroom_presets')) || {
      "Default Setup": {
        theme: "summer",
        currentClass: "Period 1",
        notes: "Welcome to class! Check today's schedule.",
        positions: {},
        visibility: {}
      }
    };
    let currentPreset = localStorage.getItem('classroom_current_preset') || "Default Setup";

    function renderPresetDropdown() {
      const selector = document.getElementById('preset-selector');
      selector.innerHTML = '';
      for (let pName in presetsData) {
        const opt = document.createElement('option');
        opt.value = pName;
        opt.textContent = pName;
        if (pName === currentPreset) opt.selected = true;
        selector.appendChild(opt);
      }
    }

    function captureCurrentBoardState() {
      const vis = {};
      widgets.forEach(w => {
        vis[w.id] = (w.style.display !== 'none');
      });

      return {
        theme: document.getElementById('bg-selector').value || 'summer',
        currentClass: currentClass,
        notes: document.getElementById('notes-content').value || '',
        positions: JSON.parse(localStorage.getItem('classroom_widget_positions')) || {},
        visibility: vis
      };
    }

    // FIX: Removed "if (!presetsData[currentPreset]) return;" so new preset names are dynamically assigned
    function saveCurrentStateToPreset() {
      presetsData[currentPreset] = captureCurrentBoardState();
      localStorage.setItem('classroom_presets', JSON.stringify(presetsData));
    }

    function applyPresetState(state) {
      if (!state) return;

      if (state.theme) {
        const bgSelector = document.getElementById('bg-selector');
        bgSelector.value = state.theme;
        handleBgChange(state.theme);
      }

      if (state.currentClass && classData[state.currentClass]) {
        currentClass = state.currentClass;
        localStorage.setItem('classroom_current_class', currentClass);
        renderClassDropdown();
      }

      if (state.notes !== undefined) {
        const notesArea = document.getElementById('notes-content');
        notesArea.value = state.notes;
      }

      if (state.positions) {
        savedPositions = state.positions;
        localStorage.setItem('classroom_widget_positions', JSON.stringify(savedPositions));
        positionWidgets();
      }

      if (state.visibility) {
        widgets.forEach(w => {
          if (state.visibility[w.id] === false) {
            w.style.display = 'none';
          } else {
            w.style.display = 'flex';
          }
        });
      }
    }

    function switchPreset(val) {
      saveCurrentStateToPreset();
      currentPreset = val;
      localStorage.setItem('classroom_current_preset', currentPreset);
      applyPresetState(presetsData[currentPreset]);
    }

    function saveNewPresetPrompt() {
      const name = prompt("Enter a name for this Board Setup:");
      if (name && name.trim()) {
        const trimmed = name.trim();
        currentPreset = trimmed;
        saveCurrentStateToPreset();
        localStorage.setItem('classroom_current_preset', currentPreset);
        renderPresetDropdown();
      }
    }

    function deleteCurrentPreset() {
      const keys = Object.keys(presetsData);
      if (keys.length <= 1) {
        alert("You must keep at least one Board Setup preset!");
        return;
      }
      if (confirm(`Delete board setup profile "${currentPreset}"?`)) {
        delete presetsData[currentPreset];
        currentPreset = Object.keys(presetsData)[0];
        localStorage.setItem('classroom_current_preset', currentPreset);
        localStorage.setItem('classroom_presets', JSON.stringify(presetsData));
        renderPresetDropdown();
        applyPresetState(presetsData[currentPreset]);
      }
    }

    function exportSetupToFile() {
      saveCurrentStateToPreset();
      const exportObject = {
        presetName: currentPreset,
        boardData: presetsData[currentPreset],
        classRosters: classData,
        quickLinks: quickLinks,
        mediaList: mediaList
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${currentPreset.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_board_setup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importSetupFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.presetName && imported.boardData) {
            const pName = imported.presetName;
            presetsData[pName] = imported.boardData;
            currentPreset = pName;

            if (imported.classRosters) classData = imported.classRosters;
            if (imported.quickLinks) quickLinks = imported.quickLinks;
            if (imported.mediaList) mediaList = imported.mediaList;

            localStorage.setItem('classroom_presets', JSON.stringify(presetsData));
            localStorage.setItem('classroom_current_preset', currentPreset);
            localStorage.setItem('classroom_classes', JSON.stringify(classData));
            localStorage.setItem('classroom_quick_links', JSON.stringify(quickLinks));
            localStorage.setItem('classroom_media_list', JSON.stringify(mediaList));

            renderPresetDropdown();
            renderClassDropdown();
            renderQuickLinks();
            renderMediaList();
            applyPresetState(presetsData[currentPreset]);
            alert(`Board Setup "${pName}" successfully loaded!`);
          } else {
            alert("Invalid configuration file format.");
          }
        } catch(err) {
          alert("Error reading JSON setup file.");
        }
      };
      reader.readAsText(file);
    }

    // --- Class Period Roster System ---
    let classData = JSON.parse(localStorage.getItem('classroom_classes')) || {
      "Period 1": "Alex\nSam\nJordan\nTaylor\nMorgan\nCasey",
      "Period 2": "Chris\nPat\nRiley\nJamie\nDakota\nAvery",
      "Period 3": "Jesse\nReese\nSkyler\nQuinn\nPeyton\nRowan"
    };
    let currentClass = localStorage.getItem('classroom_current_class') || "Period 1";

    const nameListArea = document.getElementById('name-list');
    const groupListArea = document.getElementById('group-name-list');
    const classSelector = document.getElementById('class-selector');

    function renderClassDropdown() {
      classSelector.innerHTML = '';
      for (let className in classData) {
        const opt = document.createElement('option');
        opt.value = className;
        opt.textContent = className;
        if (className === currentClass) opt.selected = true;
        classSelector.appendChild(opt);
      }
      loadRosterToWidgets();
    }

    function loadRosterToWidgets() {
      const activeRoster = classData[currentClass] || '';
      nameListArea.value = activeRoster;
      groupListArea.value = activeRoster;
    }

    function saveActiveRoster() {
      classData[currentClass] = nameListArea.value;
      localStorage.setItem('classroom_classes', JSON.stringify(classData));
    }

    nameListArea.addEventListener('input', () => {
      groupListArea.value = nameListArea.value;
      saveActiveRoster();
    });

    groupListArea.addEventListener('input', () => {
      nameListArea.value = groupListArea.value;
      saveActiveRoster();
    });

    function switchClassPeriod(val) {
      saveActiveRoster();
      currentClass = val;
      localStorage.setItem('classroom_current_class', currentClass);
      loadRosterToWidgets();
      saveCurrentStateToPreset();
    }

    function addNewClassPeriod() {
      const newName = prompt("Enter Class Period name (e.g. Period 4, Math Honor):");
      if (newName && newName.trim()) {
        const trimmed = newName.trim();
        classData[trimmed] = "";
        currentClass = trimmed;
        localStorage.setItem('classroom_classes', JSON.stringify(classData));
        localStorage.setItem('classroom_current_class', currentClass);
        renderClassDropdown();
        saveCurrentStateToPreset();
      }
    }

    function deleteCurrentClassPeriod() {
      const keys = Object.keys(classData);
      if (keys.length <= 1) {
        alert("You must keep at least one Class Period!");
        return;
      }
      if (confirm(`Delete class period "${currentClass}"?`)) {
        delete classData[currentClass];
        currentClass = Object.keys(classData)[0];
        localStorage.setItem('classroom_classes', JSON.stringify(classData));
        localStorage.setItem('classroom_current_class', currentClass);
        renderClassDropdown();
        saveCurrentStateToPreset();
      }
    }

    // --- Clock Logic ---
    let is24Hour = false;
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      let timeStr = "";

      if (is24Hour) {
        timeStr = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
      } else {
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        timeStr = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
      }

      document.getElementById('clock-display').textContent = timeStr;
      document.getElementById('clock-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
    }
    function toggleClockFormat() { is24Hour = !is24Hour; updateClock(); }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Timer Logic ---
    let timerInterval = null;
    let timerSeconds = 300;

    function updateTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function startTimer() {
      if (timerInterval) return;
      const minInput = parseInt(document.getElementById('timer-min').value) || 0;
      if (timerSeconds <= 0) timerSeconds = minInput * 60;

      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerDisplay();
        } else {
          pauseTimer();
          playTimerAudio();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      const minInput = parseInt(document.getElementById('timer-min').value) || 5;
      timerSeconds = minInput * 60;
      updateTimerDisplay();
    }

    function testTimerSound() { playTimerAudio(); }

    function playTimerAudio() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.8);
    }

    // --- Dice Logic ---
    const diceIcons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    function rollDice() {
      const count = parseInt(document.getElementById('dice-count').value);
      let res = [];
      let sum = 0;
      for (let i = 0; i < count; i++) {
        const val = Math.floor(Math.random() * 6) + 1;
        res.push(diceIcons[val - 1]);
        sum += val;
      }
      document.getElementById('dice-result').textContent = res.join(' ');
      document.getElementById('dice-sum').textContent = `Total: ${sum}`;
    }

    // --- Random Picker Logic ---
    function pickRandomName() {
      const list = nameListArea.value.split('\n').map(n => n.trim()).filter(n => n);
      if (list.length === 0) {
        document.getElementById('picker-result').textContent = "Empty";
        return;
      }
      const choice = list[Math.floor(Math.random() * list.length)];
      document.getElementById('picker-result').textContent = choice;
    }

    // --- Group Generator Logic ---
    function generateGroups() {
      const list = groupListArea.value.split('\n').map(n => n.trim()).filter(n => n);
      const size = parseInt(document.getElementById('group-size').value) || 2;
      const container = document.getElementById('group-results');
      container.innerHTML = '';

      if (list.length === 0) return;

      const shuffled = [...list].sort(() => Math.random() - 0.5);
      let gNum = 1;

      for (let i = 0; i < shuffled.length; i += size) {
        const chunk = shuffled.slice(i, i + size);
        const div = document.createElement('div');
        div.style.background = 'rgba(0,0,0,0.2)';
        div.style.padding = '6px';
        div.style.borderRadius = '6px';
        div.style.fontSize = '0.85rem';
        div.innerHTML = `<strong>Group ${gNum++}:</strong> ${chunk.join(', ')}`;
        container.appendChild(div);
      }
    }

    // --- Work Status Logic ---
    function setStatus(mode) {
      document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`st-${mode}`).classList.add('active');
    }

    // --- Background Theme Logic ---
    function handleBgChange(val) {
      const b = document.body;
      const customInput = document.getElementById('bg-upload');

      if (val === 'custom') {
        customInput.click();
        return;
      }

      const themes = {
        summer: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80',
        spring: 'https://images.unsplash.com/photo-1522383225653-ed111181a951?auto=format&fit=crop&w=1920&q=80',
        autumn: 'https://images.unsplash.com/photo-1507499739999-097706ad8914?auto=format&fit=crop&w=1920&q=80',
        winter: 'https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&w=1920&q=80',
        halloween: 'https://images.unsplash.com/photo-1509557965875-b88c97052f0e?auto=format&fit=crop&w=1920&q=80',
        default: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)',
        solid_green: '#064e3b',
        solid_slate: '#0f172a',
        solid_blue: '#1e3a8a',
        solid_pastel_blue: '#38bdf8',
        solid_cream: '#fef3c7',
        solid_purple: '#581c87'
      };

      if (themes[val]) {
        if (themes[val].startsWith('http')) {
          b.style.background = `url('${themes[val]}') center/cover fixed`;
        } else {
          b.style.background = themes[val];
        }
      }
      saveCurrentStateToPreset();
    }

    function uploadCustomBg(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.body.style.background = `url('${evt.target.result}') center/cover fixed`;
        saveCurrentStateToPreset();
      };
      reader.readAsDataURL(file);
    }

    // --- Quick Links Logic ---
    let quickLinks = JSON.parse(localStorage.getItem('classroom_quick_links')) || [
      { title: 'Google', url: 'https://google.com' }
    ];

    function renderQuickLinks() {
      const container = document.getElementById('links-container');
      container.innerHTML = '';
      quickLinks.forEach((link, idx) => {
        const card = document.createElement('a');
        card.className = 'link-card';
        card.href = link.url;
        card.target = '_blank';
        card.innerHTML = `<span>${link.title}</span><button class="link-del-btn" onclick="deleteQuickLink(event, ${idx})">✕</button>`;
        container.appendChild(card);
      });
    }

    function addQuickLink() {
      const t = document.getElementById('link-title').value.trim();
      let u = document.getElementById('link-url').value.trim();
      if (!t || !u) return;
      if (!u.startsWith('http')) u = 'https://' + u;
      quickLinks.push({ title: t, url: u });
      localStorage.setItem('classroom_quick_links', JSON.stringify(quickLinks));
      renderQuickLinks();
      document.getElementById('link-title').value = '';
      document.getElementById('link-url').value = '';
    }

    function deleteQuickLink(e, idx) {
      e.preventDefault();
      quickLinks.splice(idx, 1);
      localStorage.setItem('classroom_quick_links', JSON.stringify(quickLinks));
      renderQuickLinks();
    }

    // --- Media Player Logic ---
    let mediaList = JSON.parse(localStorage.getItem('classroom_media_list')) || [];

    function renderMediaList() {
      const container = document.getElementById('media-list');
      container.innerHTML = '';
      mediaList.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'media-item';
        div.innerHTML = `<span>${item.title}</span><button class="link-del-btn" onclick="deleteMediaItem(event, ${idx})">✕</button>`;
        div.onclick = (e) => {
          if (e.target.classList.contains('link-del-btn')) return;
          document.getElementById('media-player').src = item.url;
          document.querySelectorAll('.media-item').forEach(m => m.classList.remove('active'));
          div.classList.add('active');
        };
        container.appendChild(div);
      });
    }

    function addMediaVideo() {
      const t = document.getElementById('media-title').value.trim();
      let u = document.getElementById('media-url').value.trim();
      if (!t || !u) return;

      if (u.includes('youtube.com/watch?v=')) {
        u = u.replace('watch?v=', 'embed/');
      } else if (u.includes('youtu.be/')) {
        u = u.replace('youtu.be/', 'www.youtube.com/embed/');
      }

      mediaList.push({ title: t, url: u });
      localStorage.setItem('classroom_media_list', JSON.stringify(mediaList));
      renderMediaList();
      document.getElementById('media-title').value = '';
      document.getElementById('media-url').value = '';
    }

    function deleteMediaItem(e, idx) {
      e.stopPropagation();
      mediaList.splice(idx, 1);
      localStorage.setItem('classroom_media_list', JSON.stringify(mediaList));
      renderMediaList();
    }

    // --- Noise Monitor Logic ---
    function initNoiseMeter() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const mic = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          mic.connect(analyser);

          const data = new Uint8Array(analyser.frequencyBinCount);
          const fill = document.getElementById('meter-fill');
          document.getElementById('mic-btn').style.display = 'none';

          function updateMeter() {
            analyser.getByteFrequencyData(data);
            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i];
            const avg = sum / data.length;
            const pct = Math.min(100, Math.round((avg / 128) * 100));
            fill.style.width = `${pct}%`;
            fill.style.backgroundColor = pct > 75 ? '#ef4444' : pct > 45 ? '#f59e0b' : '#10b981';
            requestAnimationFrame(updateMeter);
          }
          updateMeter();
        })
        .catch(() => alert("Microphone access denied."));
    }

    // --- Window Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      renderPresetDropdown();
      renderClassDropdown();
      renderQuickLinks();
      renderMediaList();
      positionWidgets();
      
      if (presetsData[currentPreset]) {
        applyPresetState(presetsData[currentPreset]);
      }
    });
  </script>
</body>
</html>
