<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Classroom Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-image 0.4s ease;
    }

    /* Top Navigation Toolbar */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    
    .btn, select {
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }
    .btn:hover, select:hover { background: var(--accent-color); border-color: var(--accent-color); }
    select optgroup { background: #0f172a; color: #94a3b8; font-weight: bold; }
    select option { background: #1e293b; color: #fff; }
    .btn-action { background: var(--accent-color); }
    .btn-action:hover { background: var(--accent-hover); }
    .btn-danger { background: #7f1d1d; }
    .btn-danger:hover { background: #991b1b; }

    .class-manager-group {
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    /* Dashboard Layout & Drag/Drop Grid */
    .dashboard {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      align-items: start;
    }

    .widget {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .widget:active { cursor: grabbing; }
    .widget.dragging { opacity: 0.4; transform: scale(0.98); border: 2px dashed var(--accent-color); }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }
    .widget-title { font-size: 1.05rem; font-weight: 600; color: #cbd5e1; display: flex; align-items: center; gap: 8px; }
    .drag-handle { cursor: grab; opacity: 0.5; font-size: 1.1rem; }

    /* Specific Widget Styling */
    .display-large { font-size: 2.8rem; font-weight: 700; text-align: center; font-family: monospace; letter-spacing: 2px; }
    .sub-display { text-align: center; color: #94a3b8; font-size: 0.95rem; font-weight: 500; }
    .inputs-row { display: flex; gap: 8px; justify-content: center; align-items: center; }
    
    input[type="text"], input[type="number"], textarea, select {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      outline: none;
    }
    textarea { width: 100%; height: 90px; resize: vertical; cursor: text; }

    .result-box {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 6px;
    }

    /* Dice Specific */
    .dice-display { font-size: 3.5rem; letter-spacing: 12px; line-height: 1; }

    /* Group Output Box */
    .group-output {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Noise Meter */
    .meter-container {
      width: 100%;
      height: 24px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.1s ease, background-color 0.2s ease;
    }

    /* Status Icons */
    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .status-btn {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid transparent;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.35;
      transition: all 0.2s;
    }
    .status-btn.active { opacity: 1; transform: scale(1.04); }
    .status-red { background: #7f1d1d; color: #fca5a5; }
    .status-yellow { background: #78350f; color: #fde68a; }
    .status-green { background: #064e3b; color: #6ee7b7; }

    /* Quick Links Widget */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .link-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .link-card:hover { background: var(--accent-color); border-color: var(--accent-color); }
    .link-del-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 4px;
    }
    .link-del-btn:hover { color: #fca5a5; }
  </style>
</head>
<body>

  <header>
    <h2>Classroom Board</h2>
    
    <!-- Class Period Management Controls -->
    <div class="class-manager-group">
      <span style="font-size: 0.85rem; color: #cbd5e1; font-weight: 600;">Class:</span>
      <select id="class-selector" onchange="switchClassPeriod(this.value)"></select>
      <button class="btn" onclick="addNewClassPeriod()">➕</button>
      <button class="btn btn-danger" onclick="deleteCurrentClassPeriod()">🗑️</button>
    </div>

    <!-- Theme / Background Selector -->
    <div class="class-manager-group">
      <span style="font-size: 0.85rem; color: #cbd5e1; font-weight: 600;">Theme:</span>
      <select id="bg-selector" onchange="handleBgChange(this.value)">
        <optgroup label="Default">
          <option value="default">🎨 Dark Gradient</option>
        </optgroup>
        <optgroup label="Elementary School">
          <option value="chalkboard">✏️ Chalkboard</option>
          <option value="watercolor">🎨 Bright Watercolor</option>
          <option value="space">🚀 Outer Space</option>
          <option value="jungle">🦁 Safari Jungle</option>
        </optgroup>
        <optgroup label="Middle School">
          <option value="gaming">🎮 Retro Gaming</option>
          <option value="neon">🌆 Vaporwave / Neon</option>
          <option value="geometric">📐 Abstract Geometry</option>
        </optgroup>
        <optgroup label="High School">
          <option value="library">📚 Classic Library</option>
          <option value="coffeeshop">☕ Cozy Coffee Shop</option>
          <option value="botanical">🌿 Minimal Botanical</option>
          <option value="city">🏙️ Sunset Cityscape</option>
        </optgroup>
        <optgroup label="Custom">
          <option value="custom">📁 Upload Custom Image...</option>
        </optgroup>
      </select>
      <input type="file" id="bg-upload" accept="image/*" style="display:none" onchange="uploadCustomBg(event)">
    </div>

    <!-- Widget Toggle Toolbar -->
    <div class="toolbar">
      <button class="btn" onclick="toggleWidget('clock-widget')">⏰ Clock</button>
      <button class="btn" onclick="toggleWidget('timer-widget')">⏱️ Timer</button>
      <button class="btn" onclick="toggleWidget('links-widget')">🔗 Shortcuts</button>
      <button class="btn" onclick="toggleWidget('picker-widget')">🎲 Picker</button>
      <button class="btn" onclick="toggleWidget('dice-widget')">🎲 Dice</button>
      <button class="btn" onclick="toggleWidget('group-widget')">👥 Groups</button>
      <button class="btn" onclick="toggleWidget('noise-widget')">🎙️ Noise</button>
      <button class="btn" onclick="toggleWidget('status-widget')">🚦 Status</button>
      <button class="btn" onclick="toggleWidget('notes-widget')">📝 Notes</button>
    </div>
  </header>

  <main class="dashboard" id="dashboard">

    <!-- Digital Clock Widget -->
    <div class="widget" id="clock-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Digital Clock</span>
        <button class="btn" onclick="toggleWidget('clock-widget')">✕</button>
      </div>
      <div class="display-large" id="clock-display">00:00:00 AM</div>
      <div class="sub-display" id="clock-date">Loading date...</div>
      <div class="inputs-row">
        <button class="btn" onclick="toggleClockFormat()">Toggle 12/24h</button>
      </div>
    </div>

    <!-- Timer Widget -->
    <div class="widget" id="timer-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Timer</span>
        <button class="btn" onclick="toggleWidget('timer-widget')">✕</button>
      </div>
      <div class="display-large" id="timer-display">05:00</div>
      <div class="inputs-row">
        <input type="number" id="timer-min" placeholder="Min" min="0" value="5" style="width: 70px;">
        <button class="btn btn-action" onclick="startTimer()">Start</button>
        <button class="btn" onclick="pauseTimer()">Pause</button>
        <button class="btn" onclick="resetTimer()">Reset</button>
      </div>
      <div class="inputs-row">
        <label for="timer-sound" style="font-size: 0.85rem; color: #cbd5e1;">Sound Alert:</label>
        <select id="timer-sound" style="font-size: 0.85rem;">
          <option value="chime">🔔 Gentle Chime</option>
          <option value="beep">📟 Digital Beep</option>
          <option value="bell">🏫 School Bell</option>
          <option value="fanfare">🎉 Victory Fanfare</option>
        </select>
        <button class="btn" onclick="testTimerSound()" style="padding: 4px 8px; font-size: 0.8rem;">🔊 Test</button>
      </div>
    </div>

    <!-- Quick Links Widget -->
    <div class="widget" id="links-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Quick Shortcuts</span>
        <button class="btn" onclick="toggleWidget('links-widget')">✕</button>
      </div>
      <div id="links-container" class="links-grid"></div>
      <div class="inputs-row" style="flex-wrap: wrap; gap: 6px;">
        <input type="text" id="link-title" placeholder="Site Name" style="flex: 1; min-width: 90px; font-size: 0.85rem;">
        <input type="text" id="link-url" placeholder="https://..." style="flex: 1.5; min-width: 120px; font-size: 0.85rem;">
        <button class="btn btn-action" onclick="addQuickLink()" style="font-size: 0.85rem;">➕ Add</button>
      </div>
    </div>

    <!-- Dice Roller Widget -->
    <div class="widget" id="dice-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Dice Roller</span>
        <button class="btn" onclick="toggleWidget('dice-widget')">✕</button>
      </div>
      <div class="result-box dice-display" id="dice-result">⚀</div>
      <div class="sub-display" id="dice-sum">Total: 1</div>
      <div class="inputs-row">
        <label for="dice-count" style="font-size: 0.85rem;">Dice:</label>
        <select id="dice-count" style="width: 70px;">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
        <button class="btn btn-action" onclick="rollDice()">Roll</button>
      </div>
    </div>

    <!-- Group Generator Widget -->
    <div class="widget" id="group-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Group Maker</span>
        <button class="btn" onclick="toggleWidget('group-widget')">✕</button>
      </div>
      <textarea id="group-name-list" placeholder="Enter student names (one per line)..."></textarea>
      <div class="inputs-row">
        <input type="number" id="group-size" value="3" min="2" style="width: 80px;" placeholder="Size">
        <button class="btn btn-action" onclick="generateGroups()">Make Groups</button>
      </div>
      <div class="group-output" id="group-results"></div>
    </div>

    <!-- Random Name Picker Widget -->
    <div class="widget" id="picker-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Random Picker</span>
        <button class="btn" onclick="toggleWidget('picker-widget')">✕</button>
      </div>
      <textarea id="name-list" placeholder="Enter list (one name per line)..."></textarea>
      <button class="btn btn-action" onclick="pickRandomName()">Pick Random</button>
      <div class="result-box" id="picker-result">?</div>
    </div>

    <!-- Noise Meter Widget -->
    <div class="widget" id="noise-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Noise Monitor</span>
        <button class="btn" onclick="toggleWidget('noise-widget')">✕</button>
      </div>
      <div class="meter-container">
        <div class="meter-fill" id="meter-fill"></div>
      </div>
      <button class="btn btn-action" id="mic-btn" onclick="initNoiseMeter()">Enable Mic</button>
    </div>

    <!-- Work Status Widget -->
    <div class="widget" id="status-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Work Mode</span>
        <button class="btn" onclick="toggleWidget('status-widget')">✕</button>
      </div>
      <div class="status-grid">
        <div class="status-btn status-red" id="st-red" onclick="setStatus('red')">Silence</div>
        <div class="status-btn status-yellow" id="st-yellow" onclick="setStatus('yellow')">Whisper</div>
        <div class="status-btn status-green" id="st-green" onclick="setStatus('green')">Group Work</div>
      </div>
    </div>

    <!-- Notes Widget -->
    <div class="widget" id="notes-widget" draggable="true">
      <div class="widget-header">
        <span class="widget-title"><span class="drag-handle">⠿</span> Notes & Agenda</span>
        <button class="btn" onclick="toggleWidget('notes-widget')">✕</button>
      </div>
      <textarea id="notes-content" style="height: 120px;" placeholder="Write daily announcements or instructions..."></textarea>
    </div>

  </main>

  <script>
    // --- Toggle Visibility ---
    function toggleWidget(id) {
      const widget = document.getElementById(id);
      widget.style.display = (widget.style.display === 'none') ? 'flex' : 'none';
    }

    // --- Class Period Roster System ---
    let classData = JSON.parse(localStorage.getItem('classroom_classes')) || {
      "Period 1": "Alex\nSam\nJordan\nTaylor\nMorgan\nCasey",
      "Period 2": "Chris\nPat\nRiley\nJamie\nDakota\nAvery",
      "Period 3": "Jesse\nReese\nSkyler\nQuinn\nPeyton\nRowan"
    };
    let currentClass = localStorage.getItem('classroom_current_class') || "Period 1";

    const nameListArea = document.getElementById('name-list');
    const groupListArea = document.getElementById('group-name-list');
    const classSelector = document.getElementById('class-selector');

    function renderClassDropdown() {
      classSelector.innerHTML = '';
      for (let className in classData) {
        const opt = document.createElement('option');
        opt.value = className;
        opt.textContent = className;
        if (className === currentClass) opt.selected = true;
        classSelector.appendChild(opt);
      }
      loadRosterToWidgets();
    }

    function loadRosterToWidgets() {
      const activeRoster = classData[currentClass] || '';
      nameListArea.value = activeRoster;
      groupListArea.value = activeRoster;
    }

    function saveActiveRoster() {
      classData[currentClass] = nameListArea.value;
      localStorage.setItem('classroom_classes', JSON.stringify(classData));
    }

    function switchClassPeriod(val) {
      saveActiveRoster();
      currentClass = val;
      localStorage.setItem('classroom_current_class', currentClass);
      loadRosterToWidgets();
    }

    function addNewClassPeriod() {
      const name = prompt("Enter new Class / Period name (e.g. 'Period 4' or 'Math 101'):");
      if (name && name.trim()) {
        const trimmed = name.trim();
        if (!classData[trimmed]) {
          classData[trimmed] = "";
        }
        currentClass = trimmed;
        localStorage.setItem('classroom_current_class', currentClass);
        saveActiveRoster();
        renderClassDropdown();
      }
    }

    function deleteCurrentClassPeriod() {
      const keys = Object.keys(classData);
      if (keys.length <= 1) {
        alert("You must keep at least one class period!");
        return;
      }
      if (confirm(`Delete roster for "${currentClass}"?`)) {
        delete classData[currentClass];
        currentClass = Object.keys(classData)[0];
        localStorage.setItem('classroom_current_class', currentClass);
        localStorage.setItem('classroom_classes', JSON.stringify(classData));
        renderClassDropdown();
      }
    }

    // Sync input across textareas in real-time
    nameListArea.addEventListener('input', () => {
      groupListArea.value = nameListArea.value;
      saveActiveRoster();
    });
    groupListArea.addEventListener('input', () => {
      nameListArea.value = groupListArea.value;
      saveActiveRoster();
    });

    renderClassDropdown();

    // --- Digital Clock Logic ---
    let is24Hour = false;
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      let ampm = '';

      if (!is24Hour) {
        ampm = hours >= 12 ? ' PM' : ' AM';
        hours = hours % 12 || 12;
      }
      hours = String(hours).padStart(2, '0');

      document.getElementById('clock-display').textContent = `${hours}:${minutes}:${seconds}${ampm}`;
      const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
      document.getElementById('clock-date').textContent = now.toLocaleDateString(undefined, options);
    }
    function toggleClockFormat() {
      is24Hour = !is24Hour;
      updateClock();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Dice Roller Logic ---
    function rollDice() {
      const count = parseInt(document.getElementById('dice-count').value) || 1;
      const resultContainer = document.getElementById('dice-result');
      const sumContainer = document.getElementById('dice-sum');
      const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
      let counter = 0;

      const shuffle = setInterval(() => {
        let tempRolls = [];
        for (let i = 0; i < count; i++) {
          tempRolls.push(diceFaces[Math.floor(Math.random() * 6)]);
        }
        resultContainer.textContent = tempRolls.join(' ');
        sumContainer.textContent = 'Rolling...';
        counter++;

        if (counter > 10) {
          clearInterval(shuffle);
          let finalRolls = [];
          let sum = 0;
          for (let i = 0; i < count; i++) {
            const val = Math.floor(Math.random() * 6) + 1;
            finalRolls.push(diceFaces[val - 1]);
            sum += val;
          }
          resultContainer.textContent = finalRolls.join(' ');
          sumContainer.textContent = `Total: ${sum}`;
        }
      }, 60);
    }

    // --- Random Group Generator Logic ---
    function generateGroups() {
      const text = document.getElementById('group-name-list').value.trim();
      if (!text) return;
      let names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      if (names.length === 0) return;

      for (let i = names.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [names[i], names[j]] = [names[j], names[i]];
      }

      const groupSize = parseInt(document.getElementById('group-size').value) || 3;
      const output = document.getElementById('group-results');
      output.innerHTML = '';

      let groupNum = 1;
      for (let i = 0; i < names.length; i += groupSize) {
        const groupMembers = names.slice(i, i + groupSize);
        const groupDiv = document.createElement('div');
        groupDiv.style.background = 'rgba(0,0,0,0.25)';
        groupDiv.style.padding = '8px';
        groupDiv.style.borderRadius = '6px';
        groupDiv.style.fontSize = '0.9rem';
        groupDiv.innerHTML = `<strong>Group ${groupNum++}:</strong> ${groupMembers.join(', ')}`;
        output.appendChild(groupDiv);
      }
    }

    // --- Custom Synthesized Sound Alerts for Timer ---
    function playAlarmSound(type) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();

      const playNote = (freq, startTime, duration, soundType = 'sine') => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = soundType;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime + startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + startTime);
        osc.stop(ctx.currentTime + startTime + duration);
      };

      if (type === 'beep') {
        playNote(880, 0.0, 0.15, 'square');
        playNote(880, 0.2, 0.15, 'square');
        playNote(880, 0.4, 0.3, 'square');
      } else if (type === 'bell') {
        playNote(440, 0.0, 1.2, 'triangle');
        playNote(880, 0.0, 1.2, 'sine');
      } else if (type === 'fanfare') {
        playNote(523.25, 0.0, 0.15); // C5
        playNote(659.25, 0.15, 0.15); // E5
        playNote(783.99, 0.30, 0.15); // G5
        playNote(1046.50, 0.45, 0.6); // C6
      } else { // 'chime' default
        playNote(523.25, 0.0, 0.4);
        playNote(659.25, 0.2, 0.4);
        playNote(783.99, 0.4, 0.8);
      }
    }

    function testTimerSound() {
      const soundType = document.getElementById('timer-sound').value;
      playAlarmSound(soundType);
    }

    // --- Timer Logic ---
    let timerInterval = null;
    let totalSeconds = 300;

    function updateTimerDisplay() {
      const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const secs = (totalSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').textContent = `${mins}:${secs}`;
    }

    function startTimer() {
      if (timerInterval) return;
      const inputMins = parseInt(document.getElementById('timer-min').value);
      if (!isNaN(inputMins) && totalSeconds === 300) {
        totalSeconds = inputMins * 60;
      }
      timerInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          const soundType = document.getElementById('timer-sound').value;
          playAlarmSound(soundType);
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      const inputMins = parseInt(document.getElementById('timer-min').value) || 5;
      totalSeconds = inputMins * 60;
      updateTimerDisplay();
    }

    // --- Quick Links Widget Logic ---
    let defaultLinks = [
      { name: "Classroom", url: "https://classroom.google.com" },
      { name: "Kahoot", url: "https://kahoot.com" },
      { name: "YouTube", url: "https://youtube.com" },
      { name: "Canvas", url: "https://canvas.instructure.com" }
    ];

    let quickLinks = JSON.parse(localStorage.getItem('classroom_quick_links')) || defaultLinks;

    function renderQuickLinks() {
      const container = document.getElementById('links-container');
      container.innerHTML = '';
      quickLinks.forEach((link, idx) => {
        const a = document.createElement('a');
        a.className = 'link-card';
        a.href = link.url;
        a.target = '_blank';
        a.innerHTML = `<span>🌐 ${link.name}</span><button class="link-del-btn" onclick="deleteQuickLink(event, ${idx})">✕</button>`;
        container.appendChild(a);
      });
    }

    function addQuickLink() {
      const nameInput = document.getElementById('link-title');
      const urlInput = document.getElementById('link-url');
      let name = nameInput.value.trim();
      let url = urlInput.value.trim();

      if (!name || !url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      quickLinks.push({ name, url });
      localStorage.setItem('classroom_quick_links', JSON.stringify(quickLinks));
      nameInput.value = '';
      urlInput.value = '';
      renderQuickLinks();
    }

    function deleteQuickLink(event, index) {
      event.preventDefault();
      event.stopPropagation();
      quickLinks.splice(index, 1);
      localStorage.setItem('classroom_quick_links', JSON.stringify(quickLinks));
      renderQuickLinks();
    }

    renderQuickLinks();

    // --- Random Name Picker ---
    function pickRandomName() {
      const text = document.getElementById('name-list').value.trim();
      if (!text) return;
      const names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      if (names.length === 0) return;

      const resultContainer = document.getElementById('picker-result');
      let counter = 0;
      const shuffle = setInterval(() => {
        resultContainer.textContent = names[Math.floor(Math.random() * names.length)];
        counter++;
        if (counter > 15) {
          clearInterval(shuffle);
          const winner = names[Math.floor(Math.random() * names.length)];
          resultContainer.textContent = `🎉 ${winner}`;
        }
      }, 50);
    }

    // --- Noise Meter ---
    let audioCtx, analyser, micStream;
    async function initNoiseMeter() {
      const btn = document.getElementById('mic-btn');
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(micStream);
        source.connect(analyser);
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        btn.textContent = 'Active';
        btn.style.background = '#10b981';
        btn.disabled = true;

        function renderMeter() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let volumePercentage = Math.min(100, Math.round(((sum / dataArray.length) / 128) * 100));

          const meterFill = document.getElementById('meter-fill');
          meterFill.style.width = volumePercentage + '%';
          if (volumePercentage > 65) meterFill.style.backgroundColor = '#ef4444';
          else if (volumePercentage > 35) meterFill.style.backgroundColor = '#f59e0b';
          else meterFill.style.backgroundColor = '#10b981';

          requestAnimationFrame(renderMeter);
        }
        renderMeter();
      } catch (err) {
        alert('Microphone permission required for noise meter.');
      }
    }

    // --- Work Status ---
    function setStatus(type) {
      document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
      if (type) document.getElementById(`st-${type}`).classList.add('active');
    }

    // --- Background Selector & Custom Upload ---
    const bgPresets = {
      default: 'none',
      chalkboard: 'url("https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1920&q=80")',
      watercolor: 'url("https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1920&q=80")',
      space: 'url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80")',
      jungle: 'url("https://images.unsplash.com/photo-1511497584788-876761c11969?auto=format&fit=crop&w=1920&q=80")',
      gaming: 'url("https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1920&q=80")',
      neon: 'url("https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=1920&q=80")',
      geometric: 'url("https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1920&q=80")',
      library: 'url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1920&q=80")',
      coffeeshop: 'url("https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1920&q=80")',
      botanical: 'url("https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1920&q=80")',
      city: 'url("https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?auto=format&fit=crop&w=1920&q=80")'
    };

    function handleBgChange(val) {
      if (val === 'custom') {
        document.getElementById('bg-upload').click();
      } else {
        document.body.style.backgroundImage = bgPresets[val] || 'none';
      }
    }

    function uploadCustomBg(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.body.style.backgroundImage = `url("${e.target.result}")`;
        };
        reader.readAsDataURL(file);
      }
    }

    // --- Drag and Drop Reordering Logic ---
    const dashboard = document.getElementById('dashboard');
    let draggedItem = null;

    dashboard.addEventListener('dragstart', (e) => {
      if (e.target.classList.contains('widget')) {
        draggedItem = e.target;
        e.target.classList.add('dragging');
      }
    });

    dashboard.addEventListener('dragend', (e) => {
      if (e.target.classList.contains('widget')) {
        e.target.classList.remove('dragging');
        draggedItem = null;
      }
    });

    dashboard.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(dashboard, e.clientX, e.clientY);
      if (draggedItem) {
        if (afterElement == null) {
          dashboard.appendChild(draggedItem);
        } else {
          dashboard.insertBefore(draggedItem, afterElement);
        }
      }
    });

    function getDragAfterElement(container, x, y) {
      const draggableElements = [...container.querySelectorAll('.widget:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Persistence for Notes
    const notesArea = document.getElementById('notes-content');
    notesArea.value = localStorage.getItem('dashboard_notes') || '';
    notesArea.addEventListener('input', () => {
      localStorage.setItem('dashboard_notes', notesArea.value);
    });
  </script>
</body>
